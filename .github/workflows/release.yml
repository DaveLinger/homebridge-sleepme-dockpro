name: release
on: workflow_dispatch
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      # registry-url writes the .npmrc that `npm publish` needs. Without it the
      # NPM_TOKEN env var alone does not authenticate npm, so publishing fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Publishing is irreversible, so never ship a tree that does not pass.
      - name: Run tests
        run: npm run test

      - name: Lint the project
        run: npm run lint

      - run: npx release-it
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
