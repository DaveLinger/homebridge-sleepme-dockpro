name: release
on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment to release'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: 'Rehearse without tagging, pushing, or publishing'
        type: boolean
        default: false
jobs:
  release:
    permissions:
      contents: write
      # Lets the runner mint the OIDC token npm exchanges for short-lived publish
      # credentials. This is what replaces a stored NPM_TOKEN; the trust is
      # registered on npmjs.com against this repository and this workflow file,
      # so renaming the file breaks publishing until it is updated there.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and which npm ships with a
      # given Node release moves around, so pin the floor here rather than
      # inherit whatever the runner happens to have.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Publishing is irreversible, so never ship a tree that does not pass.
      - name: Run tests
        run: npm run test

      - name: Lint the project
        run: npm run lint

      # release-it defaults to a patch bump when given no increment, so the level
      # has to be passed explicitly or a minor release silently ships as a patch.
      # There is no NPM_TOKEN: npm authenticates over OIDC. GITHUB_TOKEN is the
      # automatic per-run token, used only to create the GitHub release.
      #
      # A dry run also skips the npm publish step. release-it only simulates the
      # version bump, so package.json still carries the released version when it
      # hands the package to `npm publish --dry-run` — and npm's dry run still
      # asks the registry, which rejects it as already published. That failure is
      # an artifact of rehearsing, not a signal, and it would occur on every dry
      # run. Publishing cannot be rehearsed against npm anyway.
      - run: npx release-it ${{ inputs.increment }} ${{ inputs.dry_run && '--dry-run --no-npm.publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
